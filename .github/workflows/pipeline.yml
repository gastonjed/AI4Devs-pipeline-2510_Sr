name: Backend CI/CD Pipeline

# Trigger on push to any branch that has an open Pull Request
on:
  push:
    branches-ignore:
      - main

jobs:
  # Gate: only proceed if there is an open PR for this branch
  check-pr:
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr }}
    steps:
      - name: Check for open Pull Request
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ github.ref_name }}" \
            --state open \
            --json number \
            --jq 'length')
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
            echo "✅ Found $PR_COUNT open PR(s) for branch ${{ github.ref_name }}"
          else
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ No open PR for branch ${{ github.ref_name }} — skipping pipeline."
          fi

  # Step 1: Run backend tests
  test:
    runs-on: ubuntu-latest
    needs: check-pr
    if: needs.check-pr.outputs.has_pr == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  # Step 2: Build the backend
  build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
            backend/prisma
          retention-days: 1

  # Step 3: Deploy to EC2
  deploy:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to EC2 via SSH (SSM)
        env:
          EC2_INSTANCE: ${{ secrets.EC2_INSTANCE }}
        run: |
          # Package the build artifacts
          tar -czf deploy.tar.gz dist package.json package-lock.json prisma

          # Copy to EC2 using SSM (no SSH keys needed with AWS credentials)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'cd /opt/app/backend || mkdir -p /opt/app/backend && cd /opt/app/backend',
              'rm -rf dist prisma',
              'npm ci --omit=dev',
              'npx prisma generate',
              'pm2 restart backend || pm2 start dist/index.js --name backend'
            ]" \
            --output text \
            --query "Command.CommandId")

          echo "📦 SSM Command sent: $COMMAND_ID"

          # Wait for the command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE" \
            || true

          # Get command result
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment failed"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

          echo "✅ Deployment completed successfully"
