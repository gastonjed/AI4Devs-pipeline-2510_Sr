name: Backend CI/CD Pipeline

# Trigger on push to any branch that has an open Pull Request
on:
  push:
    branches-ignore:
      - main

jobs:
  # Gate: only proceed if there is an open PR for this branch
  check-pr:
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr }}
    steps:
      - name: Check for open Pull Request
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ github.ref_name }}" \
            --state open \
            --json number \
            --jq 'length')
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
            echo "✅ Found $PR_COUNT open PR(s) for branch ${{ github.ref_name }}"
          else
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ No open PR for branch ${{ github.ref_name }} — skipping pipeline."
          fi

  # Step 1: Run backend tests
  test:
    runs-on: ubuntu-latest
    needs: check-pr
    if: needs.check-pr.outputs.has_pr == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  # Step 2: Build the backend
  build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
            backend/prisma
          retention-days: 1

  # Step 3: Deploy to EC2
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend

      - name: Copy files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend/dist,backend/package.json,backend/package-lock.json,backend/prisma
          target: /opt/app
          overwrite: true

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/app/backend
            npm ci --omit=dev
            npx prisma generate
            pm2 restart backend || pm2 start dist/index.js --name backend
            pm2 save
